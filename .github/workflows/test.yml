name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake g++ ninja-build

      - name: Build and install package
        run: python -m pip install --editable ".[dev]"

      - name: Run tests
        run: python -m pytest
