name: Build Wheels

on:
  release: 
    types: [published]
  workflow_dispatch: 

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix. os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps: 
    - uses: actions/checkout@v4
      with: 
        submodules: recursive

    - name: Build wheels
      uses: pypa/cibuildwheel@v2.16.5
      env:
        # Build for Python 3.8-3.11
        CIBW_BUILD:  cp38-* cp39-* cp310-* cp311-*
        CIBW_SKIP: "*-win32 *-manylinux_i686"
        
        # Architectures
        CIBW_ARCHS_MACOS: x86_64 arm64
        CIBW_ARCHS_LINUX: x86_64
        CIBW_ARCHS_WINDOWS: AMD64
        
        # Install CMake before building (CRITICAL!)
        CIBW_BEFORE_BUILD_LINUX: yum install -y cmake3 || apt-get install -y cmake
        CIBW_BEFORE_BUILD_MACOS: brew install cmake
        CIBW_BEFORE_BUILD_WINDOWS: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        
        # Test the wheel after building
        CIBW_TEST_COMMAND: pytest {project}/tests -v
        CIBW_TEST_REQUIRES: pytest numpy xarray netCDF4 matplotlib

    - uses: actions/upload-artifact@v4
      with: 
        name: wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  build_sdist:
    name:  Build source distribution
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
      with: 
        submodules: recursive

    - name: Install CMake
      run: sudo apt-get update && sudo apt-get install -y cmake

    - name: Build sdist
      run: pipx run build --sdist

    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
